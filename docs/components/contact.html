<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Spa Website</title>
    <script docs="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <!-- Include header -->
    <div class="container mx-auto py-8">
        <h2 class="text-3xl font-bold mb-4">Contact Us</h2>
        <form class="space-y-4">
            <div>
                <label for="name" class="block text-lg font-semibold">Name</label>
                <input type="text" id="name" class="w-full border-gray-300 border rounded-lg p-2">
            </div>
            <div>
                <label for="email" class="block text-lg font-semibold">Email</label>
                <input type="email" id="email" class="w-full border-gray-300 border rounded-lg p-2">
            </div>
            <div>
                <label for="message" class="block text-lg font-semibold">Message</label>
                <textarea id="message" class="w-full border-gray-300 border rounded-lg p-2" rows="4"></textarea>
            </div>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                Send Message
            </button>
        </form>
    </div>
    <!-- Include footer -->
</body>
</html>
